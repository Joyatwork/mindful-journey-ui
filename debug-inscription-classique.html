<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐛 Debug Inscription Classique</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; }
        .container { background: #f5f5f5; padding: 20px; border-radius: 10px; margin: 10px 0; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .info { background: #d1ecf1; border: 1px solid #bee5eb; color: #0c5460; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
        button:hover { background: #0056b3; }
        input { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 5px; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 5px; overflow-x: auto; font-size: 12px; }
        .step { background: #fff; padding: 15px; border-left: 4px solid #007bff; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>🐛 Debug Inscription Classique - Diagnostic Complet</h1>
    
    <div class="container info">
        <h3>🎯 Objectif: Identifier pourquoi l'inscription classique échoue</h3>
        <input type="text" id="name" placeholder="Nom complet" value="Debug Test User">
        <input type="email" id="email" placeholder="Email" value="debug.test@example.com">
        <input type="password" id="password" placeholder="Mot de passe" value="password123">
        <input type="password" id="password_confirmation" placeholder="Confirmer mot de passe" value="password123">
        
        <button onclick="runCompleteTest()">🔍 Diagnostic Complet</button>
        <button onclick="clearResults()">🧹 Nettoyer</button>
    </div>

    <div id="results"></div>

    <script>
        function addResult(content, type = 'info') {
            const div = document.createElement('div');
            div.className = `container ${type}`;
            div.innerHTML = content;
            document.getElementById('results').appendChild(div);
        }

        function addStep(content) {
            const div = document.createElement('div');
            div.className = 'step';
            div.innerHTML = content;
            document.getElementById('results').appendChild(div);
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }

        async function runCompleteTest() {
            clearResults();
            
            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                password_confirmation: document.getElementById('password_confirmation').value
            };

            addResult(`
                <h3>🧪 DIAGNOSTIC COMPLET</h3>
                <p>Test systématique de l'inscription classique</p>
                <pre>${JSON.stringify(formData, null, 2)}</pre>
            `);

            // ÉTAPE 1: Vérifier la connectivité backend
            addStep('<h4>📡 ÉTAPE 1: Test connectivité backend</h4>');
            try {
                const healthResponse = await fetch('http://localhost:8000/', {
                    method: 'GET',
                    mode: 'cors'
                });
                
                addResult(`✅ Backend accessible - Status: ${healthResponse.status}`, 'success');
            } catch (error) {
                addResult(`❌ Backend inaccessible: ${error.message}`, 'error');
                return;
            }

            // ÉTAPE 2: Test proxy frontend
            addStep('<h4>🔄 ÉTAPE 2: Test proxy frontend</h4>');
            try {
                const proxyResponse = await fetch('/api/sanctum/csrf-cookie', {
                    method: 'GET',
                    credentials: 'include'
                });
                
                addResult(`✅ Proxy fonctionne - Status: ${proxyResponse.status}`, 'success');
                
                // Afficher les cookies après CSRF
                const cookies = document.cookie;
                addResult(`
                    <h4>🍪 Cookies après CSRF:</h4>
                    <pre>${cookies || 'Aucun cookie'}</pre>
                `);
                
            } catch (error) {
                addResult(`❌ Proxy ne fonctionne pas: ${error.message}`, 'error');
                return;
            }

            // ÉTAPE 3: Test inscription SANS CSRF
            addStep('<h4>⚠️ ÉTAPE 3: Test inscription sans CSRF (pour comparaison)</h4>');
            try {
                const noCSRFResponse = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        ...formData,
                        email: 'test.nocsrf@example.com'
                    })
                });
                
                const noCSRFText = await noCSRFResponse.text();
                addResult(`
                    <h4>⚠️ Sans CSRF - Status: ${noCSRFResponse.status}</h4>
                    <pre>${noCSRFText}</pre>
                `, noCSRFResponse.ok ? 'success' : 'error');
                
            } catch (error) {
                addResult(`❌ Test sans CSRF échoué: ${error.message}`, 'error');
            }

            // ÉTAPE 4: Test inscription AVEC CSRF
            addStep('<h4>✅ ÉTAPE 4: Test inscription avec CSRF (version corrigée)</h4>');
            try {
                // D'abord récupérer un nouveau token CSRF
                await fetch('/api/sanctum/csrf-cookie', {
                    method: 'GET',
                    credentials: 'include'
                });
                
                const csrfResponse = await fetch('/api/auth/register', {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    body: JSON.stringify({
                        ...formData,
                        email: 'test.withcsrf@example.com'
                    })
                });
                
                const csrfText = await csrfResponse.text();
                
                if (csrfResponse.ok) {
                    const data = JSON.parse(csrfText);
                    addResult(`
                        <h3>🎉 AVEC CSRF - SUCCÈS!</h3>
                        <p>✅ Status: ${csrfResponse.status}</p>
                        <p>✅ Utilisateur: ${data.user.name}</p>
                        <p>✅ Email: ${data.user.email}</p>
                        <p>✅ Token: ${data.token ? 'Généré' : 'Absent'}</p>
                    `, 'success');
                } else {
                    addResult(`
                        <h3>❌ AVEC CSRF - ÉCHEC</h3>
                        <p>Status: ${csrfResponse.status}</p>
                        <p>Réponse:</p>
                        <pre>${csrfText}</pre>
                    `, 'error');
                    
                    // Essayer de parser l'erreur JSON
                    try {
                        const errorData = JSON.parse(csrfText);
                        addResult(`
                            <h4>🔍 Détails de l'erreur:</h4>
                            <pre>${JSON.stringify(errorData, null, 2)}</pre>
                        `, 'error');
                        
                        if (errorData.errors) {
                            addResult(`
                                <h4>📋 Erreurs de validation:</h4>
                                ${Object.entries(errorData.errors).map(([field, messages]) => 
                                    `<p><strong>${field}:</strong> ${Array.isArray(messages) ? messages.join(', ') : messages}</p>`
                                ).join('')}
                            `, 'error');
                        }
                    } catch (e) {
                        addResult('<p>Impossible de parser la réponse JSON</p>', 'error');
                    }
                }
                
            } catch (error) {
                addResult(`❌ Test avec CSRF échoué: ${error.message}`, 'error');
            }

            // ÉTAPE 5: Conclusion
            addStep('<h4>🎯 CONCLUSION</h4>');
            addResult(`
                <h3>📊 Résumé du diagnostic</h3>
                <p>Ce test nous montre exactement où le problème se situe.</p>
                <p>Vérifiez les résultats ci-dessus pour identifier la cause de l'échec.</p>
            `);
        }

        // Auto-exécution pour diagnostique immédiat
        window.addEventListener('load', () => {
            addResult(`
                <h3>🚀 Page de diagnostic chargée</h3>
                <p>Cette page va tester systématiquement chaque étape de l'inscription</p>
                <p>Cliquez sur "Diagnostic Complet" pour commencer l'analyse.</p>
            `);
        });
    </script>
</body>
</html>
