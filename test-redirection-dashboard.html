<!DOCTYPE html>
<html>
<head>
    <title>Test Redirection Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .section { margin: 30px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        button { padding: 10px 20px; margin: 10px; font-size: 16px; border: none; border-radius: 5px; cursor: pointer; }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-success { background-color: #28a745; color: white; }
        .btn-warning { background-color: #ffc107; color: black; }
        .btn-danger { background-color: #dc3545; color: white; }
    </style>
</head>
<body>
    <h1>🎯 Test Redirection Dashboard</h1>
    
    <div class="section info">
        <h2>📍 État actuel</h2>
        <p><strong>URL actuelle:</strong> <span id="current-url"></span></p>
        <p><strong>Paramètres URL:</strong> <span id="url-params"></span></p>
        <button class="btn-primary" onclick="checkCurrentState()">🔍 Vérifier l'état</button>
        <div id="state-result"></div>
    </div>
    
    <div class="section">
        <h2>🧪 Tests de redirection</h2>
        <button class="btn-success" onclick="testGoogleAuthFlow()">📧 Tester flow Google complet</button>
        <button class="btn-warning" onclick="simulateGoogleReturn()">🔄 Simuler retour Google</button>
        <button class="btn-danger" onclick="clearAuthAndTest()">🧹 Nettoyer et tester</button>
        <div id="redirect-result"></div>
    </div>
    
    <div class="section">
        <h2>🔐 Navigation directe</h2>
        <button class="btn-primary" onclick="goToApp()">🏠 Aller vers l'app (dashboard)</button>
        <button class="btn-primary" onclick="goToLogin()">🔑 Aller vers login</button>
    </div>
    
    <script>
        function addResult(elementId, content, type = 'info') {
            const element = document.getElementById(elementId);
            const div = document.createElement('div');
            div.className = `section ${type}`;
            div.innerHTML = content;
            element.innerHTML = '';
            element.appendChild(div);
        }
        
        function checkCurrentState() {
            const url = window.location.href;
            const params = new URLSearchParams(window.location.search);
            const token = localStorage.getItem('auth_token');
            const user = localStorage.getItem('auth_user');
            
            document.getElementById('current-url').textContent = url;
            document.getElementById('url-params').textContent = params.toString() || 'Aucun';
            
            let content = '<h4>📊 État détaillé:</h4>';
            content += `<p><strong>Token:</strong> ${token ? 'Présent (' + token.substring(0, 20) + '...)' : 'Absent'}</p>`;
            content += `<p><strong>Utilisateur:</strong> ${user ? 'Présent' : 'Absent'}</p>`;
            content += `<p><strong>Authentifié:</strong> ${token && user ? '✅ Oui' : '❌ Non'}</p>`;
            
            if (user) {
                try {
                    const parsedUser = JSON.parse(user);
                    content += `<p><strong>Nom:</strong> ${parsedUser.name}</p>`;
                    content += `<p><strong>Email:</strong> ${parsedUser.email}</p>`;
                    content += `<p><strong>Provider:</strong> ${parsedUser.provider || 'Classique'}</p>`;
                } catch (e) {
                    content += '<p style="color: red;">Erreur parsing utilisateur</p>';
                }
            }
            
            const type = (token && user) ? 'success' : 'error';
            addResult('state-result', content, type);
        }
        
        async function testGoogleAuthFlow() {
            try {
                addResult('redirect-result', '<p>🔄 Test du flow Google OAuth...</p>');
                
                const response = await fetch('http://127.0.0.1:8081/api/auth/google', {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' },
                });
                
                if (response.ok) {
                    const data = await response.json();
                    addResult('redirect-result', `
                        <h4>✅ URL Google générée!</h4>
                        <p>Cliquez pour tester le flow complet:</p>
                        <a href="${data.url}" target="_blank" style="background: #28a745; color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px;">
                            🚀 Aller vers Google OAuth
                        </a>
                        <p><small>Après authentification, vous devriez revenir automatiquement au dashboard</small></p>
                    `, 'success');
                } else {
                    throw new Error(`Erreur ${response.status}`);
                }
                
            } catch (error) {
                addResult('redirect-result', `<h4>❌ Erreur</h4><p>${error.message}</p>`, 'error');
            }
        }
        
        function simulateGoogleReturn() {
            // Simuler les données qu'un retour Google aurait
            const fakeUserData = {
                id: 999,
                name: "Test User Simulation",
                email: "test.simulation@gmail.com",
                google_id: "999999999999999999999",
                provider: "google",
                avatar_url: "https://example.com/avatar.jpg"
            };
            const fakeToken = "999|fake_token_for_simulation_purposes_only";
            
            // Sauvegarder dans localStorage
            localStorage.setItem('auth_token', fakeToken);
            localStorage.setItem('user', JSON.stringify(fakeUserData));
            
            // Rediriger avec les paramètres Google
            const newUrl = window.location.origin + window.location.pathname + '?auth=success&provider=google&redirect=dashboard';
            window.location.href = newUrl;
        }
        
        function clearAuthAndTest() {
            localStorage.removeItem('auth_token');
            localStorage.removeItem('auth_user');
            localStorage.removeItem('user');
            
            addResult('redirect-result', '<h4>✅ Données d\'auth nettoyées</h4><p>Vous pouvez maintenant tester l\'authentification à zéro</p>', 'success');
            
            setTimeout(() => {
                checkCurrentState();
            }, 500);
        }
        
        function goToApp() {
            window.location.href = 'http://localhost:8080/';
        }
        
        function goToLogin() {
            window.location.href = 'http://localhost:8080/login';
        }
        
        // Vérification automatique au chargement
        window.onload = function() {
            checkCurrentState();
        };
    </script>
</body>
</html>
