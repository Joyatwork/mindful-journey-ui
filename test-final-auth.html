<!DOCTYPE html>
<html>
<head>
    <title>Test Final - Authentification Complète</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .section { margin: 30px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        button { padding: 10px 20px; margin: 10px; font-size: 16px; border: none; border-radius: 5px; cursor: pointer; }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-success { background-color: #28a745; color: white; }
        .btn-warning { background-color: #ffc107; color: black; }
        pre { background: #f8f9fa; padding: 10px; overflow-x: auto; font-size: 12px; }
    </style>
</head>
<body>
    <h1>🧪 Test Final - Authentification Complète</h1>
    
    <div class="section info">
        <h2>📋 État actuel de localStorage</h2>
        <button class="btn-primary" onclick="checkLocalStorage()">🔍 Vérifier localStorage</button>
        <button class="btn-warning" onclick="clearLocalStorage()">🧹 Nettoyer localStorage</button>
        <div id="localStorage-result"></div>
    </div>
    
    <div class="section">
        <h2>🔐 Test inscription classique</h2>
        <button class="btn-primary" onclick="testRegister()">📝 Tester inscription</button>
        <div id="register-result"></div>
    </div>
    
    <div class="section">
        <h2>🌐 Test Google OAuth</h2>
        <button class="btn-success" onclick="testGoogleAuth()">📧 Obtenir URL Google</button>
        <button class="btn-success" onclick="redirectToGoogle()" id="google-redirect-btn" disabled>🚀 Aller vers Google</button>
        <div id="google-result"></div>
    </div>
    
    <div class="section">
        <h2>🎯 Test connexion classique</h2>
        <button class="btn-primary" onclick="testLogin()">🔑 Tester connexion</button>
        <div id="login-result"></div>
    </div>
    
    <script>
        const API_BASE_URL = 'http://127.0.0.1:8081/api';
        let googleAuthUrl = null;
        
        function addResult(elementId, content, type = 'info') {
            const element = document.getElementById(elementId);
            const div = document.createElement('div');
            div.className = `section ${type}`;
            div.innerHTML = content;
            element.innerHTML = '';
            element.appendChild(div);
        }
        
        function checkLocalStorage() {
            const token = localStorage.getItem('auth_token');
            const user = localStorage.getItem('auth_user');
            const googleUser = localStorage.getItem('user');
            
            let content = '<h4>🔍 Contenu de localStorage:</h4>';
            content += `<p><strong>auth_token:</strong> ${token ? 'Présent (' + token.substring(0, 20) + '...)' : 'Absent'}</p>`;
            content += `<p><strong>auth_user:</strong> ${user ? 'Présent' : 'Absent'}</p>`;
            content += `<p><strong>user (Google):</strong> ${googleUser ? 'Présent' : 'Absent'}</p>`;
            
            if (user) {
                try {
                    const parsedUser = JSON.parse(user);
                    content += '<pre>' + JSON.stringify(parsedUser, null, 2) + '</pre>';
                } catch (e) {
                    content += '<p style="color: red;">Erreur de parsing user</p>';
                }
            }
            
            addResult('localStorage-result', content, 'info');
        }
        
        function clearLocalStorage() {
            localStorage.removeItem('auth_token');
            localStorage.removeItem('auth_user');
            localStorage.removeItem('user');
            addResult('localStorage-result', '<h4>✅ localStorage nettoyé</h4>', 'success');
        }
        
        async function testRegister() {
            try {
                addResult('register-result', '<p>🔄 Test inscription en cours...</p>');
                
                // 1. CSRF Token
                const csrfResponse = await fetch('http://127.0.0.1:8081/sanctum/csrf-cookie', {
                    method: 'GET',
                    credentials: 'include',
                    headers: { 'Accept': 'application/json' },
                });
                
                if (!csrfResponse.ok) {
                    throw new Error(`CSRF failed: ${csrfResponse.status}`);
                }
                
                // 2. Registration
                const registerResponse = await fetch(`${API_BASE_URL}/auth/register`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest',
                    },
                    body: JSON.stringify({
                        name: 'Test Final User',
                        email: 'testfinal@example.com',
                        password: 'password123'
                    })
                });
                
                if (registerResponse.ok) {
                    const data = await registerResponse.json();
                    addResult('register-result', `
                        <h4>✅ Inscription réussie!</h4>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `, 'success');
                } else {
                    const errorText = await registerResponse.text();
                    addResult('register-result', `
                        <h4>❌ Inscription échouée</h4>
                        <p>Status: ${registerResponse.status}</p>
                        <pre>${errorText}</pre>
                    `, 'error');
                }
                
            } catch (error) {
                addResult('register-result', `
                    <h4>🚨 Erreur</h4>
                    <p>${error.message}</p>
                `, 'error');
            }
        }
        
        async function testGoogleAuth() {
            try {
                addResult('google-result', '<p>🔄 Test Google OAuth en cours...</p>');
                
                const response = await fetch(`${API_BASE_URL}/auth/google`, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' },
                });
                
                if (response.ok) {
                    const data = await response.json();
                    googleAuthUrl = data.url;
                    
                    addResult('google-result', `
                        <h4>✅ URL Google générée!</h4>
                        <p><strong>URL:</strong> ${data.url.substring(0, 100)}...</p>
                        <p>Cliquez sur "Aller vers Google" pour tester</p>
                    `, 'success');
                    
                    document.getElementById('google-redirect-btn').disabled = false;
                } else {
                    const errorText = await response.text();
                    addResult('google-result', `
                        <h4>❌ Erreur Google OAuth</h4>
                        <p>Status: ${response.status}</p>
                        <pre>${errorText}</pre>
                    `, 'error');
                }
                
            } catch (error) {
                addResult('google-result', `
                    <h4>🚨 Erreur</h4>
                    <p>${error.message}</p>
                `, 'error');
            }
        }
        
        function redirectToGoogle() {
            if (googleAuthUrl) {
                window.location.href = googleAuthUrl;
            } else {
                alert('Veuillez d\'abord obtenir l\'URL Google');
            }
        }
        
        async function testLogin() {
            try {
                addResult('login-result', '<p>🔄 Test connexion en cours...</p>');
                
                // 1. CSRF Token
                const csrfResponse = await fetch('http://127.0.0.1:8081/sanctum/csrf-cookie', {
                    method: 'GET',
                    credentials: 'include',
                    headers: { 'Accept': 'application/json' },
                });
                
                if (!csrfResponse.ok) {
                    throw new Error(`CSRF failed: ${csrfResponse.status}`);
                }
                
                // 2. Login
                const loginResponse = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest',
                    },
                    body: JSON.stringify({
                        email: 'alicamara291@gmail.com', // Utilisateur existant
                        password: 'password123'
                    })
                });
                
                if (loginResponse.ok) {
                    const data = await loginResponse.json();
                    addResult('login-result', `
                        <h4>✅ Connexion réussie!</h4>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `, 'success');
                } else {
                    const errorText = await loginResponse.text();
                    addResult('login-result', `
                        <h4>❌ Connexion échouée</h4>
                        <p>Status: ${loginResponse.status}</p>
                        <pre>${errorText}</pre>
                    `, 'error');
                }
                
            } catch (error) {
                addResult('login-result', `
                    <h4>🚨 Erreur</h4>
                    <p>${error.message}</p>
                `, 'error');
            }
        }
        
        // Vérification automatique au chargement
        window.onload = function() {
            checkLocalStorage();
        };
    </script>
</body>
</html>
