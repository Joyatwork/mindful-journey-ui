<!DOCTYPE html>
<html>
<head>
    <title>Test Auth Classique - État Actuel</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .section { margin: 30px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        button { padding: 10px 20px; margin: 10px; font-size: 16px; border: none; border-radius: 5px; cursor: pointer; }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-success { background-color: #28a745; color: white; }
        .btn-danger { background-color: #dc3545; color: white; }
        pre { background: #f8f9fa; padding: 10px; overflow-x: auto; font-size: 12px; }
    </style>
</head>
<body>
    <h1>🧪 Test Auth Classique - État Actuel de Votre Code</h1>
    
    <div class="section info">
        <h2>📋 Actions disponibles</h2>
        <button class="btn-primary" onclick="checkStatus()">🔍 Vérifier l'état actuel</button>
        <button class="btn-danger" onclick="cleanStart()">🧹 Nettoyer et recommencer</button>
        <div id="status-result"></div>
    </div>
    
    <div class="section">
        <h2>✅ Test 1: Inscription classique</h2>
        <button class="btn-success" onclick="testInscription()">📝 Tester inscription</button>
        <div id="inscription-result"></div>
    </div>
    
    <div class="section">
        <h2>✅ Test 2: Connexion classique</h2>
        <button class="btn-success" onclick="testConnexion()">🔑 Tester connexion</button>
        <div id="connexion-result"></div>
    </div>
    
    <div class="section">
        <h2>🌐 Navigation vers votre app</h2>
        <button class="btn-primary" onclick="goToApp()">🏠 Ouvrir votre application</button>
        <button class="btn-primary" onclick="goToLogin()">🔐 Ouvrir page de login</button>
    </div>
    
    <script>
        const API_BASE_URL = 'http://127.0.0.1:8081/api';
        
        function addResult(elementId, content, type = 'info') {
            const element = document.getElementById(elementId);
            const div = document.createElement('div');
            div.className = `section ${type}`;
            div.innerHTML = content;
            element.innerHTML = '';
            element.appendChild(div);
        }
        
        function checkStatus() {
            const token = localStorage.getItem('auth_token');
            const user = localStorage.getItem('auth_user');
            
            let content = '<h4>🔍 État actuel:</h4>';
            content += `<p><strong>Backend API:</strong> ${API_BASE_URL}</p>`;
            content += `<p><strong>Frontend:</strong> http://localhost:8080</p>`;
            content += `<p><strong>Token stocké:</strong> ${token ? '✅ Oui (' + token.substring(0, 20) + '...)' : '❌ Non'}</p>`;
            content += `<p><strong>Utilisateur stocké:</strong> ${user ? '✅ Oui' : '❌ Non'}</p>`;
            
            if (user) {
                try {
                    const parsedUser = JSON.parse(user);
                    content += `<p><strong>Nom:</strong> ${parsedUser.name}</p>`;
                    content += `<p><strong>Email:</strong> ${parsedUser.email}</p>`;
                } catch (e) {
                    content += '<p style="color: red;">Erreur parsing utilisateur</p>';
                }
            }
            
            const type = (token && user) ? 'success' : 'info';
            addResult('status-result', content, type);
        }
        
        function cleanStart() {
            localStorage.clear();
            addResult('status-result', '<h4>✅ Nettoyage terminé</h4><p>Prêt pour de nouveaux tests</p>', 'success');
        }
        
        async function testInscription() {
            try {
                addResult('inscription-result', '<p>🔄 Test inscription en cours...</p>');
                
                // 1. CSRF
                console.log('🔒 Récupération CSRF...');
                const csrfResponse = await fetch('http://127.0.0.1:8081/sanctum/csrf-cookie', {
                    method: 'GET',
                    credentials: 'include',
                    headers: { 'Accept': 'application/json' },
                });
                
                if (!csrfResponse.ok) {
                    throw new Error(`CSRF failed: ${csrfResponse.status}`);
                }
                console.log('✅ CSRF OK');
                
                // 2. Inscription
                console.log('📝 Inscription...');
                const email = 'test' + Date.now() + '@example.com'; // Email unique
                const registerResponse = await fetch(`${API_BASE_URL}/auth/register`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest',
                    },
                    body: JSON.stringify({
                        name: 'Test User ' + Date.now(),
                        email: email,
                        password: 'password123',
                        password_confirmation: 'password123'
                    })
                });
                
                console.log('📨 Response status:', registerResponse.status);
                
                if (registerResponse.ok) {
                    const data = await registerResponse.json();
                    console.log('✅ Inscription réussie:', data);
                    
                    addResult('inscription-result', `
                        <h4>✅ Inscription réussie!</h4>
                        <p><strong>Nom:</strong> ${data.user.name}</p>
                        <p><strong>Email:</strong> ${data.user.email}</p>
                        <p><strong>Token:</strong> ${data.token ? 'Généré ✅' : 'Manquant ❌'}</p>
                        <p><em>Vous pouvez maintenant tester la connexion avec cet utilisateur</em></p>
                        <details>
                            <summary>Détails complets</summary>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </details>
                    `, 'success');
                    
                    // Sauvegarder pour le test de connexion
                    window.testUserEmail = email;
                    
                } else {
                    const errorText = await registerResponse.text();
                    console.error('❌ Erreur inscription:', errorText);
                    
                    addResult('inscription-result', `
                        <h4>❌ Inscription échouée</h4>
                        <p><strong>Status:</strong> ${registerResponse.status}</p>
                        <p><strong>Détails:</strong></p>
                        <pre>${errorText}</pre>
                    `, 'error');
                }
                
            } catch (error) {
                console.error('🚨 Exception:', error);
                addResult('inscription-result', `
                    <h4>🚨 Erreur technique</h4>
                    <p><strong>Message:</strong> ${error.message}</p>
                    <p>Vérifiez que le serveur backend est démarré</p>
                `, 'error');
            }
        }
        
        async function testConnexion() {
            try {
                addResult('connexion-result', '<p>🔄 Test connexion en cours...</p>');
                
                const email = window.testUserEmail || 'test@example.com';
                
                // 1. CSRF
                console.log('🔒 Récupération CSRF...');
                const csrfResponse = await fetch('http://127.0.0.1:8081/sanctum/csrf-cookie', {
                    method: 'GET',
                    credentials: 'include',
                    headers: { 'Accept': 'application/json' },
                });
                
                if (!csrfResponse.ok) {
                    throw new Error(`CSRF failed: ${csrfResponse.status}`);
                }
                console.log('✅ CSRF OK');
                
                // 2. Connexion
                console.log('🔑 Connexion...');
                const loginResponse = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest',
                    },
                    body: JSON.stringify({
                        email: email,
                        password: 'password123'
                    })
                });
                
                console.log('📨 Response status:', loginResponse.status);
                
                if (loginResponse.ok) {
                    const data = await loginResponse.json();
                    console.log('✅ Connexion réussie:', data);
                    
                    addResult('connexion-result', `
                        <h4>✅ Connexion réussie!</h4>
                        <p><strong>Nom:</strong> ${data.user.name}</p>
                        <p><strong>Email:</strong> ${data.user.email}</p>
                        <p><strong>Token:</strong> ${data.token ? 'Valide ✅' : 'Manquant ❌'}</p>
                        <p><em>L'authentification classique fonctionne parfaitement!</em></p>
                        <details>
                            <summary>Détails complets</summary>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </details>
                    `, 'success');
                    
                } else {
                    const errorText = await loginResponse.text();
                    console.error('❌ Erreur connexion:', errorText);
                    
                    addResult('connexion-result', `
                        <h4>❌ Connexion échouée</h4>
                        <p><strong>Status:</strong> ${loginResponse.status}</p>
                        <p><strong>Email testé:</strong> ${email}</p>
                        <p><em>Faites d'abord une inscription si ce n'est pas fait</em></p>
                        <details>
                            <summary>Détails de l'erreur</summary>
                            <pre>${errorText}</pre>
                        </details>
                    `, 'error');
                }
                
            } catch (error) {
                console.error('🚨 Exception:', error);
                addResult('connexion-result', `
                    <h4>🚨 Erreur technique</h4>
                    <p><strong>Message:</strong> ${error.message}</p>
                    <p>Vérifiez que le serveur backend est démarré</p>
                `, 'error');
            }
        }
        
        function goToApp() {
            window.open('http://localhost:8080/', '_blank');
        }
        
        function goToLogin() {
            window.open('http://localhost:8080/login', '_blank');
        }
        
        // Vérification automatique au chargement
        window.onload = function() {
            checkStatus();
        };
    </script>
</body>
</html>
