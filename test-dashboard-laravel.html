<!DOCTYPE html>
<html>
<head>
    <title>Test Dashboard Laravel</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .section { margin: 30px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        button { padding: 10px 20px; margin: 10px; font-size: 16px; border: none; border-radius: 5px; cursor: pointer; }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-success { background-color: #28a745; color: white; }
        .btn-warning { background-color: #ffc107; color: black; }
        iframe { width: 100%; height: 400px; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <h1>🎯 Test Dashboard Laravel</h1>
    
    <div class="section info">
        <h2>📍 URLs de test</h2>
        <p><strong>Frontend React:</strong> http://localhost:8080</p>
        <p><strong>Backend Laravel:</strong> http://127.0.0.1:8081</p>
        <p><strong>Dashboard Laravel:</strong> http://127.0.0.1:8081/dashboard</p>
    </div>
    
    <div class="section">
        <h2>🧪 Tests d'accès</h2>
        <button class="btn-primary" onclick="testLaravelHome()">🏠 Tester Laravel Home</button>
        <button class="btn-primary" onclick="testLaravelDashboard()">📊 Tester Laravel Dashboard</button>
        <button class="btn-success" onclick="testGoogleAuth()">📧 Tester Google Auth → Dashboard</button>
        <div id="test-result"></div>
    </div>
    
    <div class="section">
        <h2>🔍 Aperçu Laravel</h2>
        <button class="btn-warning" onclick="showLaravelHome()">👀 Voir Laravel Home</button>
        <button class="btn-warning" onclick="showLaravelDashboard()">👀 Voir Laravel Dashboard</button>
        <div id="preview-container"></div>
    </div>
    
    <script>
        function addResult(content, type = 'info') {
            const element = document.getElementById('test-result');
            const div = document.createElement('div');
            div.className = `section ${type}`;
            div.innerHTML = content;
            element.innerHTML = '';
            element.appendChild(div);
        }
        
        async function testLaravelHome() {
            try {
                addResult('<p>🔄 Test Laravel Home...</p>');
                
                const response = await fetch('http://127.0.0.1:8081/', {
                    method: 'GET',
                    credentials: 'include'
                });
                
                if (response.ok) {
                    addResult(`
                        <h4>✅ Laravel Home accessible</h4>
                        <p><strong>Status:</strong> ${response.status}</p>
                        <p><strong>URL:</strong> ${response.url}</p>
                    `, 'success');
                } else {
                    addResult(`
                        <h4>❌ Erreur Laravel Home</h4>
                        <p><strong>Status:</strong> ${response.status}</p>
                    `, 'error');
                }
                
            } catch (error) {
                addResult(`
                    <h4>🚨 Erreur</h4>
                    <p>${error.message}</p>
                `, 'error');
            }
        }
        
        async function testLaravelDashboard() {
            try {
                addResult('<p>🔄 Test Laravel Dashboard...</p>');
                
                const response = await fetch('http://127.0.0.1:8081/dashboard', {
                    method: 'GET',
                    credentials: 'include'
                });
                
                if (response.ok) {
                    addResult(`
                        <h4>✅ Laravel Dashboard accessible</h4>
                        <p><strong>Status:</strong> ${response.status}</p>
                        <p><strong>URL:</strong> ${response.url}</p>
                        <p>Vous êtes probablement connecté !</p>
                    `, 'success');
                } else if (response.status === 302 || response.status === 401) {
                    addResult(`
                        <h4>🔐 Redirection (pas connecté)</h4>
                        <p><strong>Status:</strong> ${response.status}</p>
                        <p>Le dashboard nécessite une authentification</p>
                        <p><strong>Redirected to:</strong> ${response.url}</p>
                    `, 'info');
                } else {
                    addResult(`
                        <h4>❌ Erreur Laravel Dashboard</h4>
                        <p><strong>Status:</strong> ${response.status}</p>
                    `, 'error');
                }
                
            } catch (error) {
                addResult(`
                    <h4>🚨 Erreur</h4>
                    <p>${error.message}</p>
                `, 'error');
            }
        }
        
        async function testGoogleAuth() {
            try {
                addResult('<p>🔄 Test Google Auth vers Dashboard...</p>');
                
                const response = await fetch('http://127.0.0.1:8081/api/auth/google', {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' },
                });
                
                if (response.ok) {
                    const data = await response.json();
                    addResult(`
                        <h4>✅ URL Google générée!</h4>
                        <p>Testez maintenant le flow complet:</p>
                        <a href="${data.url}" target="_blank" style="background: #28a745; color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px;">
                            🚀 Google Auth → Dashboard Laravel
                        </a>
                        <p><small>Après Google, vous devriez arriver sur le dashboard Laravel (Inertia.js)</small></p>
                    `, 'success');
                } else {
                    throw new Error(`Erreur ${response.status}`);
                }
                
            } catch (error) {
                addResult(`<h4>❌ Erreur</h4><p>${error.message}</p>`, 'error');
            }
        }
        
        function showLaravelHome() {
            const container = document.getElementById('preview-container');
            container.innerHTML = `
                <h4>🏠 Laravel Home</h4>
                <iframe src="http://127.0.0.1:8081/"></iframe>
            `;
        }
        
        function showLaravelDashboard() {
            const container = document.getElementById('preview-container');
            container.innerHTML = `
                <h4>📊 Laravel Dashboard</h4>
                <iframe src="http://127.0.0.1:8081/dashboard"></iframe>
                <p><small>Si vous voyez une page de connexion, c'est normal (pas encore connecté)</small></p>
            `;
        }
    </script>
</body>
</html>
