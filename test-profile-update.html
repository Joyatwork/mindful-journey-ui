<!DOCTYPE html>
<html>
<head>
    <title>Test API Profile Update</title>
</head>
<body>
    <h1>Test de mise à jour du profil</h1>
    
    <div id="results"></div>
    
    <script>
        const API_BASE = 'http://127.0.0.1:8081/api';
        
        async function testProfileUpdate() {
            const results = document.getElementById('results');
            
            try {
                // 1. Login d'abord
                results.innerHTML += '<h3>1. Connexion...</h3>';
                const loginResponse = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'john.doe@example.com',
                        password: 'password123'
                    })
                });
                
                const loginData = await loginResponse.json();
                console.log('Login response:', loginData);
                results.innerHTML += `<p>Login: ${loginResponse.ok ? 'SUCCESS' : 'FAILED'}</p>`;
                
                if (!loginResponse.ok) {
                    results.innerHTML += `<p>Erreur: ${JSON.stringify(loginData)}</p>`;
                    return;
                }
                
                const token = loginData.token;
                results.innerHTML += `<p>Token reçu: ${token ? 'OUI' : 'NON'}</p>`;
                
                // 2. Récupérer les données actuelles
                results.innerHTML += '<h3>2. Récupération des données actuelles...</h3>';
                const userResponse = await fetch(`${API_BASE}/auth/user`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/json'
                    }
                });
                
                const userData = await userResponse.json();
                console.log('User data before update:', userData);
                results.innerHTML += `<p>Données actuelles: ${JSON.stringify(userData.user, null, 2).substring(0, 200)}...</p>`;
                
                // 3. Mettre à jour le profil
                results.innerHTML += '<h3>3. Mise à jour du profil...</h3>';
                const updateData = {
                    name: userData.user.name,
                    email: userData.user.email,
                    phone: '0123456789',
                    bio: 'Bio mise à jour via test API - ' + new Date().toISOString(),
                    location: 'Paris Test',
                    jobPosition: 'Développeur Test',
                    company: 'Test Company',
                    goals: 'Objectifs de test'
                };
                
                const updateResponse = await fetch(`${API_BASE}/auth/profile`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(updateData)
                });
                
                const updateResult = await updateResponse.json();
                console.log('Update response:', updateResult);
                results.innerHTML += `<p>Mise à jour: ${updateResponse.ok ? 'SUCCESS' : 'FAILED'}</p>`;
                results.innerHTML += `<p>Réponse: ${JSON.stringify(updateResult, null, 2)}</p>`;
                
                // 4. Vérifier que les données ont été sauvées
                results.innerHTML += '<h3>4. Vérification des données mises à jour...</h3>';
                const verifyResponse = await fetch(`${API_BASE}/auth/user`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/json'
                    }
                });
                
                const verifyData = await verifyResponse.json();
                console.log('User data after update:', verifyData);
                results.innerHTML += `<p>Données après mise à jour: ${JSON.stringify(verifyData.user, null, 2)}</p>`;
                
                // Comparaison
                const bioChanged = verifyData.user.bio !== userData.user.bio;
                const phoneChanged = verifyData.user.phone !== userData.user.phone;
                results.innerHTML += `<h3>Résultat:</h3>`;
                results.innerHTML += `<p>Bio changée: ${bioChanged ? 'OUI' : 'NON'}</p>`;
                results.innerHTML += `<p>Téléphone changé: ${phoneChanged ? 'OUI' : 'NON'}</p>`;
                
            } catch (error) {
                console.error('Erreur:', error);
                results.innerHTML += `<p>ERREUR: ${error.message}</p>`;
            }
        }
        
        // Lancer le test au chargement
        testProfileUpdate();
    </script>
</body>
</html>
